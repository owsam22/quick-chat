
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!-- Primary SEO -->
    <title>QuickChat – Temporary Chat Rooms with QR Code Join</title>

    <meta
      name="description"
      content="Create temporary chat rooms with QuickChat. No login or phone number required. Share a QR code, chat in real time, and let late joiners catch up on the conversation."
    />

    <meta name="author" content="Samarpan" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://quickchat.owsam22.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/QuickChat-icon.png"
    />

    <meta name="application-name" content="QuickChat" />

    <!-- Open Graph: WhatsApp, LinkedIn, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuickChat" />
    <meta
      property="og:title"
      content="QuickChat – Instant Chat Rooms with QR Join"
    />
    <meta
      property="og:description"
      content="Start a temporary group chat in seconds. No accounts or phone numbers. Create a room, share the QR code, and chat instantly."
    />
    <meta
      property="og:url"
      content="https://quickchat.owsam22.com/"
    />
    <meta
      property="og:image"
      content="https://quickchat.owsam22.com/quickchat-preview.png"
    />
    <meta
      property="og:image:alt"
      content="QuickChat temporary real-time chat rooms"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="QuickChat – Temporary Chat Rooms"
    />
    <meta
      name="twitter:description"
      content="Create a room, share the QR code, and chat in real time. No login required."
    />
    <meta
      name="twitter:image"
      content="https://quickchat.owsam22.com/quickchat-preview.png"
    />
    <meta name="twitter:creator" content="@samarpan22" />

    <!-- Google Search Console verification -->
    <meta
      name="google-site-verification"
      content="ye99MNo_Zlmrss5aG-fukQRM3SY5xsttXllVJgu2ffU"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "QuickChat",
        "url": "https://quickchat.owsam22.com/",
        "description": "A temporary real-time chat application for creating instant group conversations without accounts or phone numbers, with QR code joining and session-based message history.",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern web browser"
      }
    </script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>
      <p>
        QuickChat lets you create temporary chat rooms without signing up.
        Share a QR code to invite participants and chat in real time.
        JavaScript is required to use QuickChat.
      </p>
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
